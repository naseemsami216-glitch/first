apiVersion: v1
kind: Namespace
metadata: { name: demo-app }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: app-config, namespace: demo-app }
data:
  DB_HOST: postgres
  DB_NAME: appdb
  REDIS_URL: redis://redis:6379
---
# Replace values before applying (or create with: kubectl create secret generic ...)
apiVersion: v1
kind: Secret
metadata: { name: app-secret, namespace: demo-app }
type: Opaque
stringData:
  DB_USER: appuser
  DB_PASSWORD: change-me-strong-password
