# Persistent Volume Claim -> data survives pod restarts
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-pvc, namespace: demo-app }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
  # storageClassName: gp3   # EKS; omit on Minikube (uses default "standard")
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: demo-app }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: app-secret, key: DB_USER } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: app-secret, key: DB_PASSWORD } } }
            - { name: POSTGRES_DB, valueFrom: { configMapKeyRef: { name: app-config, key: DB_NAME } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "appuser"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-pvc }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: demo-app }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
